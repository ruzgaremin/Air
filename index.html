<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Air</title>
  <style>
    /* Remove default margins and page scrolling */
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background-color: #000;
    }

    /* Scale the sky image to fill the entire screen */
    .sky-container {
      background-image: url('air.jpg');
      height: 100%;
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
    }
  </style>
</head>
<body>

  <div class="sky-container"></div>

</body>
</html>
